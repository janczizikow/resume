name: Build resume
on:
  push:
    branches: [main]
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v2
      - name: Spellcheck
        run: |
          bash scripts/spellcheck.sh list
      - name: compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: |
            resume.tex
      - name:
        uses: actions/upload-artifact@v2
        with:
          name: resume.pdf
          path: resume.pdf
